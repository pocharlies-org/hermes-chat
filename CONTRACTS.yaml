# Contratos de <hermes-chat> (ley de contratos de la casa).
# Lo declarado aquí no se renombra ni se elimina; un cambio incompatible = entrada .vN+1.
version: 1
contracts:
  - id: hermes-chat.wire.v1
    kind: schema
    value: "meta · delta · reasoning · tool · tool_result · request · plan · custom · error · done"
    role: consumer
    files:
      - hermes-chat.js
    status: active
    note: >
      El componente POSTea al `turnUrl` del host {text, conversation?, mode?, model?, answer?} y lee
      SSE (text/event-stream) con estos tipos de evento; los comentarios `:` son keepalive. El host
      traduce su vocabulario Hermes a este (ley DGX-1301: la traducción es del huésped). Tipos:
      meta{conversation} · delta{text} · reasoning{text} · tool{id,name,args} · tool_result{id,ok,summary}
      · request{kind:approve|question|plan,…} (la respuesta vuelve como `answer`) · plan{steps[{text,status}]}
      · custom{kind,data} (lo renderiza el host vía `renderers[kind]`) · error{message} · done{stopped?}.

  - id: hermes-chat.api.v1
    kind: schema
    value: customElements.define('hermes-chat', HermesChat)
    role: publisher
    files:
      - hermes-chat.js
    status: active
    note: >
      Propiedades del custom element que inyecta el host (nunca un fork del chat): turnUrl, transport,
      models, model, modes, conversations, currentConversation, contextLine, busy, renderers,
      transformAssistant, hydrateMedia, placeholder, labels y messages (historial [{role,text}] que el
      host siembra al abrir una conversación — aditivo, 26-11). Slots: composer-actions, settings.
      Eventos: new/open/rename/delete-conversation, conversation-change, model-change, mode-change,
      stop, turn-end. Método: send(text?).
